# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this GitHub repo, then: Dashboard ? New ? Blueprint ? select repo
# Set secret env vars in the Render dashboard (sync: false below).

services:
  - type: web
    name: finsight
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: finsight
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_EMAIL
        value: demo@finsight.app
      - key: DEMO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: ALGORAND_NETWORK
        value: algorand-testnet
      - key: PAY_TO
        sync: false
      - key: FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: X402_PRICE_USDC
        value: "0.005"
      - key: X402_PLAN_PRICE_USDC
        value: "0.002"
      - key: X402_ALLOW_SIMULATION
        value: "true"
      - key: AVM_PRIVATE_KEY
        sync: false
